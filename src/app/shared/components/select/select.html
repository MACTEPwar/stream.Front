<p-select
  [id]="id()"
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder() ?? ''"
  [filter]="filter()"
  [filterBy]="optionLabel()"
  appendTo="body"
  panelStyleClass="app-select-panel"
  [ngModel]="value()"
  (ngModelChange)="value.set($event)"
/>
