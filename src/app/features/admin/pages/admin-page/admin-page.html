<div class="admin-page">
  <aside class="admin-page__sidebar">
    <nav class="admin-page__nav">
      @for (group of menuGroups; track group.label) {
        <div class="admin-page__nav-group">
          <button
            type="button"
            class="admin-page__nav-group-header"
            (click)="toggleGroup(group.label)"
          >
            <span
              class="admin-page__nav-group-chevron"
              [class.admin-page__nav-group-chevron--expanded]="isGroupExpanded(group.label)"
              aria-hidden="true"
              >›</span
            >
            {{ group.label }}
          </button>

          @if (isGroupExpanded(group.label)) {
            <div class="admin-page__nav-group-items">
              @for (item of group.items; track item.path) {
                <a
                  [routerLink]="item.path"
                  routerLinkActive="admin-page__nav-link--active"
                  class="admin-page__nav-link"
                >
                  {{ item.label }}
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>
  </aside>

  <div class="admin-page__main">
    <nav class="admin-page__breadcrumbs" aria-label="breadcrumb">
      @for (crumb of breadcrumbService.crumbs(); track $index; let last = $last) {
        <span class="admin-page__breadcrumb">{{ crumb }}</span>
        @if (!last) {
          <span class="admin-page__breadcrumb-separator" aria-hidden="true">/</span>
        }
      }
    </nav>

    <div class="admin-page__content">
      <router-outlet />
    </div>
  </div>
</div>
