<div class="admin-news-tags-page">
  <div class="admin-news-tags-page__toolbar">
    <app-text-field
      class="admin-news-tags-page__search-field"
      placeholder="Поиск по названию"
      [(value)]="searchFilter"
    />
    <app-button text="Добавить" (click)="onAddClick()" />
  </div>

  @if (hasError()) {
    <app-error-message message="Не удалось загрузить теги" />
  } @else {
    <p-table [value]="filteredTags()" [loading]="isLoading()" dataKey="id">
      <ng-template #header>
        <tr>
          <th>Название</th>
          <th>Цвет</th>
          <th>Цвет текста</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-tag>
        <tr>
          <td>{{ tag.name }}</td>
          <td>
            <span class="admin-news-tags-page__color-swatch" [style.background]="tag.color"></span>
            {{ tag.color }}
          </td>
          <td>
            <span class="admin-news-tags-page__color-swatch" [style.background]="tag.textColor"></span>
            {{ tag.textColor }}
          </td>
          <td class="admin-news-tags-page__actions-cell">
            <app-button-group>
              <app-button text="Изменить" size="small" severity="info" (click)="onEditClick(tag)" />
              <app-button text="Удалить" size="small" severity="danger" (click)="onDeleteClick(tag)" />
            </app-button-group>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }

  <p-drawer
    [(visible)]="drawerVisible"
    position="right"
    [header]="editingTagId() ? 'Изменить тег' : 'Новый тег'"
    styleClass="admin-news-tags-page__drawer"
    [style]="{ width: '480px', 'max-width': '90vw' }"
  >
    <div class="admin-news-tags-page__form">
      <app-text-field label="Название" [(value)]="name" [required]="true" />

      <div class="admin-news-tags-page__field">
        <label for="admin-news-tags-color">Цвет</label>
        <div class="admin-news-tags-page__color-row">
          <app-text-field id="admin-news-tags-color" placeholder="#FF5733" [(value)]="color" />
          <input
            type="color"
            class="admin-news-tags-page__color-input"
            [value]="color()"
            (input)="color.set($any($event.target).value)"
          />
        </div>
      </div>

      <div class="admin-news-tags-page__field">
        <label for="admin-news-tags-text-color">Цвет текста</label>
        <div class="admin-news-tags-page__color-row">
          <app-text-field id="admin-news-tags-text-color" placeholder="#FFFFFF" [(value)]="textColor" />
          <input
            type="color"
            class="admin-news-tags-page__color-input"
            [value]="textColor()"
            (input)="textColor.set($any($event.target).value)"
          />
        </div>
      </div>

      <app-button
        text="Сохранить"
        [disabled]="isSaving()"
        (click)="onSaveClick()"
        class="admin-news-tags-page__save-button"
      />
    </div>
  </p-drawer>
</div>
