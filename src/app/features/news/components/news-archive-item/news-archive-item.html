<article class="news-archive-item">
  <div class="news-archive-item__picture">
    @if (imageUrl(); as url) {
      <img [src]="url" alt="" />
    }

    <div class="news-archive-item__tags">
      @for (tag of item().tags; track tag.id) {
        <app-badge [text]="tag.name" [color]="tag.color" [textColor]="tag.textColor" />
      }
    </div>
  </div>

  <div class="news-archive-item__body">
    <div class="news-archive-item__text">
      <h3 class="news-archive-item__heading">{{ item().title }}</h3>
      <p class="news-archive-item__excerpt">{{ item().description }}</p>
    </div>

    <div class="news-archive-item__data">
      <div class="news-archive-item__counters">
        <app-checkbox
          class="news-archive-item__counter-checkbox news-archive-item__counter-checkbox--readonly"
          [buttonMode]="true"
          severity="contrast"
          [checked]="false"
        >
          <i class="pi pi-eye" aria-hidden="true"></i>
          {{ viewsLabel() }}
        </app-checkbox>

        <app-checkbox
          class="news-archive-item__counter-checkbox"
          [buttonMode]="true"
          severity="contrast"
          [checked]="isLiked()"
          (checkedChange)="onLikeToggle($event)"
        >
          <i class="pi pi-heart" aria-hidden="true"></i>
          {{ likesLabel() }}
        </app-checkbox>
      </div>

      <span class="news-archive-item__date">{{ dateLabel() }}</span>
    </div>
  </div>
</article>
