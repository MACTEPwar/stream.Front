<article class="news-archive-item">
  @if (imageUrl(); as url) {
    <button type="button" class="news-archive-item__picture" (click)="onOpenDetail()">
      <img [src]="url" alt="" />

      <div class="news-archive-item__tags news-archive-item__tags--overlay">
        @for (tag of item().tags; track tag.id) {
          <app-badge [text]="tag.name" [color]="tag.color" [textColor]="tag.textColor" />
        }
      </div>
    </button>
  }

  <div class="news-archive-item__body" [class.news-archive-item__body--full]="!imageUrl()">
    @if (!imageUrl() && item().tags.length > 0) {
      <div class="news-archive-item__tags news-archive-item__tags--inline">
        @for (tag of item().tags; track tag.id) {
          <app-badge [text]="tag.name" [color]="tag.color" [textColor]="tag.textColor" />
        }
      </div>
    }

    <button type="button" class="news-archive-item__text" (click)="onOpenDetail()">
      <h3 class="news-archive-item__heading">{{ item().title }}</h3>
      <p class="news-archive-item__excerpt">{{ item().description }}</p>
    </button>

    <div class="news-archive-item__data">
      <div class="news-archive-item__counters">
        <app-checkbox
          class="news-archive-item__counter-checkbox news-archive-item__counter-checkbox--readonly"
          [buttonMode]="true"
          severity="contrast"
          [checked]="isViewed()"
        >
          <i class="pi pi-eye" aria-hidden="true"></i>
          {{ viewsLabel() }}
        </app-checkbox>

        <app-checkbox
          class="news-archive-item__counter-checkbox"
          [buttonMode]="true"
          severity="contrast"
          [checked]="isLiked()"
          (checkedChange)="onLikeToggle($event)"
        >
          <i [class]="likeIconClass()" aria-hidden="true"></i>
          {{ likesLabel() }}
        </app-checkbox>
      </div>

      <span class="news-archive-item__date">{{ dateLabel() }}</span>
    </div>
  </div>
</article>
