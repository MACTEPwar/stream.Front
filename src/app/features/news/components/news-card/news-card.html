<article class="news-card">
  <div class="news-card__picture">
    @if (item().imageUrl; as imageUrl) {
      <img [src]="imageUrl" alt="" />
    }
  </div>

  <div class="news-card__body">
    <div class="news-card__content">
      <div class="news-card__text">
        <h3 class="news-card__heading">{{ item().title }}</h3>
        <p class="news-card__excerpt">{{ item().excerpt }}</p>
      </div>

      <div class="news-card__tags">
        @for (tag of tags(); track tag.id) {
          <app-badge [text]="tag.name" [severity]="tag.severity ?? 'primary'" [color]="tag.color" />
        }
      </div>
    </div>

    <div class="news-card__data">
      <div class="news-card__counters">
        <span class="news-card__counter">
          <i class="pi pi-eye" aria-hidden="true"></i>
          {{ viewsLabel() }}
        </span>
        <span class="news-card__counter">
          <i class="pi pi-heart" aria-hidden="true"></i>
          {{ likesLabel() }}
        </span>
      </div>

      <span class="news-card__date">{{ dateLabel() }}</span>
    </div>
  </div>
</article>
