<article
  class="news-card"
  [style.flex-direction]="flexDirection()"
  [style.background]="cardStyle().backgroundColor"
  [style.color]="cardStyle().textColor"
>
  <div class="news-card__picture" [style.flex]="pictureFlexBasis()">
    @if (item().imageUrl; as imageUrl) {
      <img [src]="imageUrl" alt="" [style.object-position]="imageObjectPosition()" />
    }
  </div>

  <div class="news-card__body">
    <div class="news-card__content">
      <div class="news-card__text">
        <h3 class="news-card__heading">{{ item().title }}</h3>
        <p class="news-card__excerpt">{{ item().excerpt }}</p>
      </div>

      <div class="news-card__tags">
        @for (tag of tags(); track tag.id) {
          <app-badge
            [text]="tag.name"
            [severity]="tag.severity ?? 'primary'"
            [color]="tag.color"
            [textColor]="tag.textColor"
          />
        }
      </div>
    </div>

    <div class="news-card__data" [style.border-top-color]="dividerColor()">
      <div class="news-card__counters">
        <span class="news-card__counter">
          <i class="pi pi-eye" aria-hidden="true"></i>
          {{ viewsLabel() }}
        </span>
        <span class="news-card__counter">
          <i [class]="likeIconClass()" aria-hidden="true"></i>
          {{ likesLabel() }}
        </span>
      </div>

      <span class="news-card__date">{{ dateLabel() }}</span>
    </div>
  </div>
</article>
