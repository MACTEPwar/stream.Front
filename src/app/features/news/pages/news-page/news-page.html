<div class="news-page__background" aria-hidden="true"></div>

<div class="news-page">
  <app-pinned-news-grid
    class="news-page__grid"
    [class.pinned-news-grid--auto-height]="!isArchiveBeside()"
    aria-label="Новости"
    [entries]="gridEntries()"
    [columns]="gridConfig().columns"
    [rows]="gridConfig().rows"
  />

  <aside class="news-page__archive" aria-label="Архив новостей">
    <div class="news-page__archive-toolbar">
      <app-button-group>
        <app-button icon="pi pi-minus" severity="contrast" (click)="resetArchiveFilters()" />

        <app-checkbox
          [buttonMode]="true"
          [squareIcon]="true"
          severity="contrast"
          [checked]="showOnlyViewed()"
          (checkedChange)="onOwnReactionFilterChange('viewed', $event)"
        >
          <i class="pi pi-eye" aria-hidden="true"></i>
        </app-checkbox>

        <app-checkbox
          [buttonMode]="true"
          [squareIcon]="true"
          severity="contrast"
          [checked]="showOnlyLiked()"
          (checkedChange)="onOwnReactionFilterChange('liked', $event)"
        >
          <i class="pi pi-heart" aria-hidden="true"></i>
        </app-checkbox>
      </app-button-group>

      <app-news-filter-sidebar (filterChange)="filter.set($event)" />
    </div>

    <div class="news-page__archive-list" (scroll)="onArchiveScroll($event)">
      @for (item of archiveEntries(); track item.id) {
        <app-news-archive-item
          [item]="item"
          (likeToggle)="onLikeToggle(item, $event)"
          (openDetail)="onOpenDetail(item)"
        />
      } @empty {
        @if (!isLoadingArchive()) {
          <p class="news-page__empty">По выбранному фильтру новостей нет</p>
        }
      }
    </div>
  </aside>
</div>
