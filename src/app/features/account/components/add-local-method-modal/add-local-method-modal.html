<div class="add-local-method-modal">
  <h2 class="add-local-method-modal__title">Подключить локальный вход</h2>

  <form class="add-local-method-modal__form" (submit)="$event.preventDefault(); onSubmit()">
    <app-text-field label="Логин" [required]="true" placeholder="Введите логин" [(value)]="login">
      <img icon src="/icons/text-field-person.svg" alt="" />
    </app-text-field>
    <app-text-field
      label="Пароль"
      type="password"
      [required]="true"
      placeholder="Введите пароль"
      [(value)]="password"
    >
      <img icon src="/icons/text-field-lock.svg" alt="" />
    </app-text-field>

    <div class="add-local-method-modal__actions">
      <app-decorative-button text="Подключить" type="primary" [width]="'content'" (click)="onSubmit()" />
      <app-decorative-button text="Отмена" type="secondary" [width]="'content'" (click)="onCancel()" />
    </div>
  </form>
</div>
